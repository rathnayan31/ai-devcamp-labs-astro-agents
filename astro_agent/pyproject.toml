[project]
name = "pixel-astro-agent"
version = "0.1.0"
description = "Pixel Astro multi-agent astrologer (Google ADK) — Phase 1: Build"
requires-python = ">=3.11"
dependencies = [
    "google-adk[mcp]==2.10.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]
