[project]
name = "pixel-astro-agent"
version = "0.1.0"
description = "Pixel Astro multi-agent astrologer (Google ADK) — Build and Scale"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-adk[bigquery-analytics,gcp,mcp,otel-gcp]==2.10.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]==2.10.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]
